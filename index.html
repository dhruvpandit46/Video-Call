<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P Video Chat </title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.4.7/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 1200px;
            width: 100%;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .your-id {
            background: rgba(255,255,255,0.2);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 1.1em;
        }
        
        .your-id strong {
            color: #ffd700;
        }
        
        .content {
            padding: 30px;
        }
        
        .connection-section {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        input {
            padding: 12px 20px;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-size: 1em;
            width: 300px;
            max-width: 100%;
        }
        
        button {
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s;
            font-weight: bold;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-disconnect {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .btn-random {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        
        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: bold;
        }
        
        .status.waiting {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.connected {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .video-section {
            display: none;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .video-section.active {
            display: grid;
        }
        
        .video-container {
            position: relative;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 4/3;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .video-label {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
        }
        
        .chat-section {
            display: none;
            margin-top: 20px;
        }
        
        .chat-section.active {
            display: block;
        }
        
        .chat-box {
            border: 2px solid #667eea;
            border-radius: 10px;
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 10px;
            padding: 10px;
            border-radius: 10px;
            max-width: 70%;
        }
        
        .message.sent {
            background: #667eea;
            color: white;
            margin-left: auto;
        }
        
        .message.received {
            background: #e9ecef;
            color: #333;
        }
        
        .chat-input-group {
            display: flex;
            gap: 10px;
        }
        
        .chat-input-group input {
            flex: 1;
        }
        
        @media (max-width: 768px) {
            .video-section {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .input-group {
                flex-direction: column;
                align-items: stretch;
            }
            
            input, button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎥 P2P Video Chat</h1>
            <p>Random Video Chat</p>
            <div class="your-id">
                <strong>Aapki ID:</strong> <span id="myPeerId">Loading...</span>
            </div>
        </div>
        
        <div class="content">
            <div class="connection-section">
                <div class="input-group">
                    <input type="text" id="remotePeerIdInput" placeholder="Dusre user ki ID enter karein">
                    <button id="connectBtn" onclick="connectToPeer()">Connect Karo</button>
                    <button id="randomBtn" class="btn-random" onclick="findRandomPeer()">Random Stranger</button>
                </div>
                <button id="disconnectBtn" class="btn-disconnect" onclick="disconnect()" style="display:none;">Disconnect Karo</button>
                
                <div id="statusDiv"></div>
            </div>
            
            <div class="video-section" id="videoSection">
                <div class="video-container">
                    <video id="localVideo" autoplay muted playsinline></video>
                    <div class="video-label">Aap</div>
                </div>
                <div class="video-container">
                    <video id="remoteVideo" autoplay playsinline></video>
                    <div class="video-label">Stranger</div>
                </div>
            </div>
            
            <div class="chat-section" id="chatSection">
                <div class="chat-box" id="chatBox"></div>
                <div class="chat-input-group">
                    <input type="text" id="messageInput" placeholder="Message type karein..." onkeypress="handleEnter(event)">
                    <button onclick="sendMessage()">Bhejo</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let peer;
        let myPeerId;
        let currentCall;
        let currentConnection;
        let localStream;
        
        // Initialize PeerJS with free cloud server
        function initPeer() {
            peer = new Peer({
                config: {
                    'iceServers': [
                        { urls: 'stun:stun.l.google.com:19302' },
                        { urls: 'stun:stun1.l.google.com:19302' }
                    ]
                }
            });
            
            peer.on('open', (id) => {
                myPeerId = id;
                document.getElementById('myPeerId').textContent = id;
                showStatus('Aap ready ho! Apni ID share karein ya kisi se connect karein.', 'connected');
            });
            
            peer.on('call', (call) => {
                showStatus('Incoming call...', 'waiting');
                
                navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                    .then((stream) => {
                        localStream = stream;
                        document.getElementById('localVideo').srcObject = stream;
                        
                        call.answer(stream);
                        currentCall = call;
                        
                        call.on('stream', (remoteStream) => {
                            document.getElementById('remoteVideo').srcObject = remoteStream;
                            document.getElementById('videoSection').classList.add('active');
                            document.getElementById('chatSection').classList.add('active');
                            document.getElementById('disconnectBtn').style.display = 'inline-block';
                            showStatus('Video call connected! 🎉', 'connected');
                        });
                    })
                    .catch((err) => {
                        showStatus('Camera/mic access denied: ' + err, 'error');
                    });
            });
            
            peer.on('connection', (conn) => {
                currentConnection = conn;
                setupDataConnection(conn);
            });
            
            peer.on('error', (err) => {
                showStatus('Error: ' + err.type, 'error');
            });
        }
        
        function connectToPeer() {
            const remotePeerId = document.getElementById('remotePeerIdInput').value.trim();
            
            if (!remotePeerId) {
                showStatus('Please enter peer ID', 'error');
                return;
            }
            
            showStatus('Connecting...', 'waiting');
            
            navigator.mediaDevices.getUserMedia({ video: true, audio: true })
                .then((stream) => {
                    localStream = stream;
                    document.getElementById('localVideo').srcObject = stream;
                    
                    const call = peer.call(remotePeerId, stream);
                    currentCall = call;
                    
                    call.on('stream', (remoteStream) => {
                        document.getElementById('remoteVideo').srcObject = remoteStream;
                        document.getElementById('videoSection').classList.add('active');
                        document.getElementById('chatSection').classList.add('active');
                        document.getElementById('disconnectBtn').style.display = 'inline-block';
                        showStatus('Video call connected! 🎉', 'connected');
                    });
                    
                    const conn = peer.connect(remotePeerId);
                    currentConnection = conn;
                    setupDataConnection(conn);
                })
                .catch((err) => {
                    showStatus('Camera/mic access denied: ' + err, 'error');
                });
        }
        
        function setupDataConnection(conn) {
            conn.on('open', () => {
                console.log('Data connection established');
            });
            
            conn.on('data', (data) => {
                if (data.type === 'message') {
                    addMessage(data.text, 'received');
                }
            });
        }
        
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (message && currentConnection) {
                currentConnection.send({ type: 'message', text: message });
                addMessage(message, 'sent');
                input.value = '';
            }
        }
        
        function addMessage(text, type) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.textContent = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
        
        function handleEnter(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        function disconnect() {
            if (currentCall) {
                currentCall.close();
            }
            if (currentConnection) {
                currentConnection.close();
            }
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
            }
            
            document.getElementById('videoSection').classList.remove('active');
            document.getElementById('chatSection').classList.remove('active');
            document.getElementById('disconnectBtn').style.display = 'none';
            document.getElementById('remoteVideo').srcObject = null;
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('chatBox').innerHTML = '';
            
            showStatus('Disconnected. Nayi connection start karo!', 'waiting');
        }
        
        function findRandomPeer() {
            showStatus('Random matching feature requires a signaling server. Please exchange IDs manually for now.', 'error');
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('statusDiv');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
            statusDiv.style.display = 'block';
        }
        
        // Initialize on load
        window.onload = () => {
            initPeer();
        };
    </script>
</body>
</html>
